name: Download verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  filesystem:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Verify destination, copying, ZIP extraction and metadata preservation
        run: dotnet run --project 'Tools~/Verification/Verification.csproj'
